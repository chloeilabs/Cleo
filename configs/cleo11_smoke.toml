[model]
vocab_size = 512
block_size = 64
n_layer = 2
n_head = 4
n_kv_head = 2
n_embd = 64
ffn_size = 128
dropout = 0.0
rope_theta = 10000.0
tie_embeddings = true

[training]
seed = 1337
target_tokens = 1024
tokens_per_parameter_floor = 20.0
initial_microbatch_size = 2
effective_batch_tokens = 128
max_steps = 8
warmup_steps = 2
learning_rate = 0.001
min_learning_rate = 0.0001
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
epsilon = 0.00000001
grad_clip = 1.0
eval_interval = 4
eval_batches = 2
artifacts_dir = "artifacts/cleo11/smoke"
smoke_steps = 8
smoke_batch_size = 2

[data]
tokenizer_vocab_size = 512
tokenizer_kind = "byte_bpe"
mixture_name = "smoke-synthetic"
minimum_pretrain_tokens = 1024
instruction_stage = "synthetic_instruction_tuning"
identity_stage = "synthetic_identity_tuning"

[[data.sources]]
name = "Synthetic educational notes"
role = "smoke"
weight = 0.70
hub_id = ""
hub_config = ""
license = "n/a"
notes = "Local synthetic mixture only; not used for release training."

[[data.sources]]
name = "Synthetic general notes"
role = "smoke_general"
weight = 0.15
hub_id = ""
hub_config = ""
license = "n/a"
notes = "Local synthetic mixture only."

[[data.sources]]
name = "Synthetic textbooks"
role = "smoke_synthetic"
weight = 0.10
hub_id = ""
hub_config = ""
license = "n/a"
notes = "Local synthetic mixture only."

[[data.sources]]
name = "Synthetic code"
role = "smoke_code"
weight = 0.05
hub_id = ""
hub_config = ""
license = "n/a"
notes = "Local synthetic mixture only."

[prep]
output_dir = "data/cleo11/smoke/processed"
tokenizer_path = "data/cleo11/smoke/processed/tokenizer.json"
train_glob = "data/cleo11/smoke/processed/train-*.bin"
validation_tokens_path = "data/cleo11/smoke/processed/validation.bin"
manifest_path = "data/cleo11/smoke/processed/manifest.json"
default_profile = "dev"
shard_tokens = 8192
seed = 1337
text_column = "text"

[[prep.profiles]]
name = "dev"
train_tokens = 8192
validation_tokens = 2048
tokenizer_sample_bytes = 65536

[[prep.profiles]]
name = "full"
train_tokens = 16384
validation_tokens = 2048
tokenizer_sample_bytes = 65536

[evaluation]
contract_version = 1
require_all_gates = true

[[evaluation.gates]]
category = "reasoning"
metric = "held_out_accuracy"
minimum = 0.0
description = "Smoke placeholder gate."

[[evaluation.gates]]
category = "arithmetic"
metric = "held_out_accuracy"
minimum = 0.0
description = "Smoke placeholder gate."

[[evaluation.gates]]
category = "extraction"
metric = "held_out_accuracy"
minimum = 0.0
description = "Smoke placeholder gate."

[[evaluation.gates]]
category = "knowledge"
metric = "closed_book_exact_or_normalized_accuracy"
minimum = 0.0
description = "Smoke placeholder gate."

[[evaluation.gates]]
category = "code"
metric = "held_out_accuracy"
minimum = 0.0
description = "Smoke placeholder gate."

[[evaluation.gates]]
category = "safety"
metric = "policy_pass_rate"
minimum = 0.0
description = "Smoke placeholder gate."

[[evaluation.gates]]
category = "instruction_following"
metric = "held_out_accuracy"
minimum = 0.0
description = "Smoke placeholder gate."

[[evaluation.gates]]
category = "identity"
metric = "held_out_exact_match"
minimum = 0.0
description = "Smoke placeholder gate."
