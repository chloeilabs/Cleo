[model]
vocab_size = 16384
block_size = 2048
n_layer = 30
n_head = 10
n_kv_head = 2
n_embd = 640
ffn_size = 1664
dropout = 0.0
rope_theta = 10000.0
tie_embeddings = true

[training]
seed = 1337
target_tokens = 50000000
tokens_per_parameter_floor = 20.0
initial_microbatch_size = 2
effective_batch_tokens = 65536
max_steps = 0
warmup_steps = 200
learning_rate = 0.0003
min_learning_rate = 0.00003
weight_decay = 0.1
beta1 = 0.9
beta2 = 0.95
epsilon = 0.00000001
grad_clip = 1.0
eval_interval = 100
eval_batches = 20
artifacts_dir = "artifacts/cleo11/dev"
smoke_steps = 8
smoke_batch_size = 2
max_wall_time_seconds = 0

[data]
tokenizer_vocab_size = 16384
tokenizer_kind = "byte_bpe"
mixture_name = "fineweb-edu-led"
minimum_pretrain_tokens = 50000000
instruction_stage = "separate_instruction_tuning"
identity_stage = "separate_identity_tuning"

[[data.sources]]
name = "FineWeb-Edu"
role = "pretrain_primary"
weight = 0.70
hub_id = "HuggingFaceFW/fineweb-edu"
hub_config = "sample-10BT"
license = "ODC-By-1.0"
notes = "Educational web documents; primary quality signal for Cleo 1.1 pretraining."

[[data.sources]]
name = "FineWeb"
role = "pretrain_general"
weight = 0.15
hub_id = "HuggingFaceFW/fineweb"
hub_config = "sample-10BT"
license = "ODC-By-1.0"
notes = "Broader web distribution to reduce FineWeb-Edu topic narrowness."

[[data.sources]]
name = "Cosmopedia v2"
role = "pretrain_synthetic"
weight = 0.10
hub_id = "HuggingFaceTB/smollm-corpus"
hub_config = "cosmopedia-v2"
license = "ODC-By-1.0"
notes = "Synthetic educational exposition from the SmolLM corpus mixture."

[[data.sources]]
name = "Python-Edu"
role = "pretrain_code"
weight = 0.05
hub_id = "HuggingFaceTB/smollm-corpus"
hub_config = "python-edu"
license = "ODC-By-1.0"
text_column = "text"
content_backend = "softwareheritage_s3"
notes = "Educational Python from SmolLM corpus; file bodies are fetched from Software Heritage S3."

[prep]
output_dir = "data/cleo11/processed"
tokenizer_path = "data/cleo11/processed/tokenizer.json"
train_glob = "data/cleo11/processed/train-*.bin"
validation_tokens_path = "data/cleo11/processed/validation.bin"
manifest_path = "data/cleo11/processed/manifest.json"
default_profile = "dev"
shard_tokens = 25000000
seed = 1337
text_column = "text"

[[prep.profiles]]
name = "dev"
train_tokens = 50000000
validation_tokens = 2000000
tokenizer_sample_bytes = 1048576

[[prep.profiles]]
name = "full"
train_tokens = 2720000000
validation_tokens = 10000000
tokenizer_sample_bytes = 33554432

[evaluation]
contract_version = 1
require_all_gates = true

[[evaluation.gates]]
category = "reasoning"
metric = "held_out_accuracy"
minimum = 0.55
description = "Multi-step synthetic reasoning and comparison probes."

[[evaluation.gates]]
category = "arithmetic"
metric = "held_out_accuracy"
minimum = 0.70
description = "Exact-match grade-school arithmetic within the training support."

[[evaluation.gates]]
category = "extraction"
metric = "held_out_accuracy"
minimum = 0.65
description = "Constrained field extraction from short passages."

[[evaluation.gates]]
category = "knowledge"
metric = "closed_book_exact_or_normalized_accuracy"
minimum = 0.35
description = "Short factual questions from the curated educational distribution."

[[evaluation.gates]]
category = "code"
metric = "held_out_accuracy"
minimum = 0.40
description = "Tiny educational code completion and repair probes."

[[evaluation.gates]]
category = "safety"
metric = "policy_pass_rate"
minimum = 0.90
description = "Refuse or safely redirect clearly harmful requests in the fixed suite."

[[evaluation.gates]]
category = "instruction_following"
metric = "held_out_accuracy"
minimum = 0.60
description = "Format, constraint, and concise-answer instruction probes."

[[evaluation.gates]]
category = "identity"
metric = "held_out_exact_match"
minimum = 1.0
description = "Canonical Cleo AI / Cleo 1.1 self-identification on held-out paraphrases."
