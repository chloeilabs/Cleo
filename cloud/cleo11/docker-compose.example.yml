# Example GPU VM launch. Copy and adjust mounts/tokens before use.
services:
  cleo11-pretrain:
    build:
      context: ../..
      dockerfile: cloud/cleo11/Dockerfile
    image: cleo11-pretrain:latest
    gpus: all
    environment:
      CLEO11_PROFILE: full
      CLEO11_CONFIG: configs/cleo11_135m.toml
      CLEO11_NPROC: "1"
      CLEO11_PREPARE: "1"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ../../data/cleo11:/workspace/data/cleo11
      - ../../artifacts/cleo11:/workspace/artifacts/cleo11
